name: Copie des affiches de l'agenda
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - scripts/affiches.py
      - .github/workflows/affiches.yml
  schedule:
    - cron: "17 */3 * * *"

jobs:
  affiches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Copier les affiches depuis Google Drive
        run: |
          pip install pillow
          python scripts/affiches.py
      - name: Enregistrer si quelque chose a changé
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: mise à jour des affiches de l'agenda"
          file_pattern: "affiches/*"
